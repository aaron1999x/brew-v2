name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy public values in the right format. CI never talks to a real Supabase project from the app.
  NEXT_PUBLIC_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy_key_for_ci
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_APP_ENV: local

jobs:
  app:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:tokens
      - run: npm run test
      - run: npm run build
      - name: Secret-leak check (client bundle)
        run: |
          # supabase-js itself contains the literal prefix "sb_secret_" (it warns when a secret key is
          # used in a browser), so look for key-shaped values (prefix + 16 or more key characters),
          # the legacy service_role markers, and the real secret if the build has one.
          if grep -rIlE 'sb_secret_[A-Za-z0-9_-]{16,}|service_role|c2VydmljZV9yb2xl' .next/static; then
            echo "::error::A secret or legacy service_role marker was found in the client bundle (.next/static)."
            exit 1
          fi
          if [ -n "$SUPABASE_SECRET_KEY" ] && grep -rIlF -- "$SUPABASE_SECRET_KEY" .next/static; then
            echo "::error::The secret key value was found in the client bundle (.next/static)."
            exit 1
          fi
          echo "No secrets in .next/static"

  db:
    name: Database tests on a throwaway database
    runs-on: ubuntu-latest
    env:
      # Only for this job: lets scripts/assert-staging.mjs accept a 127.0.0.1 URL (and nothing else).
      SKIP_ASSERT_STAGING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0
      # Applies every migration in supabase/migrations from scratch, then we run the RLS suite.
      # Services this suite doesn't need are excluded to keep the job fast.
      - name: Start a local Supabase stack
        run: supabase start -x studio,mailpit,logflare,vector,edge-runtime,imgproxy,realtime,postgres-meta,supavisor
      - name: Run pgTAP RLS tests
        run: node scripts/db-test.mjs --db-url postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Stop the local stack
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: Playwright (iPhone and desktop) with axe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
